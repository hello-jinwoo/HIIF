# PPS Integration Test Configuration
# Test: 10 users, 50 epochs for final code review

model:
  name: hiif-pps
  args:
    encoder_spec:
      name: edsr-baseline
      args:
        no_upsampling: true
        n_resblocks: 16
        n_feats: 64
    hidden_dim: 256
    blocks: 16
    # user_ids will be auto-detected from dataset

train_dataset:
  dataset:
    name: pps-preference-pair
    args:
      root_path: ./load/PPS/images
      response_dir: ./load/PPS/responses/train
      cache: in_memory
      # Will auto-load first 10 users
  wrapper:
    name: pps-color-augmented
    args:
      crop_size: 64  # Small crop for faster testing
      augment: true
      augment_params:
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
  batch_size: 2  # 2 samples × 4 inputs = 8 images
  sampler:
    iterations_per_user: 8  # 8 iterations per user

val_dataset:
  dataset:
    name: pps-preference-pair
    args:
      root_path: ./load/PPS/images
      response_dir: ./load/PPS/responses/validation
      cache: in_memory
  wrapper:
    name: pps-color-augmented
    args:
      crop_size: 64
      augment: false
  batch_size: 2

optimizer:
  name: adam
  args:
    lr: 1.e-4
    betas: [0.9, 0.999]

epoch_max: 50  # Integration test: 50 epochs
epoch_val: 10
epoch_save: 10

loss_schedule:
  schedule_type: exponential
  w_p_start: 0.5
  w_p_end: 0.8
  # total_iterations auto-computed as: epoch_max × batches_per_epoch

data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}
