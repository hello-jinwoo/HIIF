# PPS Training Configuration with SwinIR Encoder - Quick Test
# Test: 10 users, 50 epochs (~4-5 hours on single GPU)
# Use this to verify SwinIR works before running full-scale training

model:
  name: hiif-pps
  args:
    encoder_spec:
      name: swinir
      args:
        no_upsampling: true
    hidden_dim: 256
    blocks: 16

train_dataset:
  dataset:
    name: pps-preference-pair
    args:
      root_path: ./load/PPS/images
      response_dir: ./load/PPS/responses/train
      cache: in_memory
      # Will auto-load first 10 users
  wrapper:
    name: pps-color-augmented
    args:
      crop_size: 96  # Medium crop for testing (balance between speed and quality)
      augment: true
      augment_params:
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
  batch_size: 2
  sampler:
    iterations_per_user: 8  # Fewer iterations for faster testing

val_dataset:
  dataset:
    name: pps-preference-pair
    args:
      root_path: ./load/PPS/images
      response_dir: ./load/PPS/responses/validation
      cache: in_memory
  wrapper:
    name: pps-color-augmented
    args:
      crop_size: 96
      augment: false
  batch_size: 2

optimizer:
  name: adam
  args:
    lr: 2.e-4
    betas: [0.9, 0.999]

epoch_max: 50  # Quick test: 50 epochs
epoch_val: 10
epoch_save: 10

loss_schedule:
  schedule_type: exponential
  w_p_start: 0.5
  w_p_end: 0.8

data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}
