# =============================================================================
# Unified PPS Test Configuration - 2 Users, EDSR, Quick Testing
# =============================================================================
# This is a minimal config for quick testing with just 2 users
#
# Usage:
#   python train_pps.py --config configs/pps/test_2users.yaml --tag test_2users
#   python validate_pps.py --config configs/pps/test_2users.yaml --tag test_2users
# =============================================================================

# =============================================================================
# Shared Configuration
# =============================================================================

model:
  name: hiif-pps
  args:
    encoder_spec:
      name: edsr-baseline
      args:
        no_upsampling: true
        n_resblocks: 16
        n_feats: 64
    hidden_dim: 256
    blocks: 16

val_dataset:
  dataset:
    name: pps-preference-pair
    args:
      root_path: ./load/PPS/images
      response_dir: ./load/PPS/responses/validation
      cache: in_memory
  wrapper:
    name: pps-color-augmented
    args:
      crop_size: 64
      augment: false
  batch_size: 2

data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}

# =============================================================================
# Training Configuration - Quick Test Settings
# =============================================================================

train_dataset:
  dataset:
    name: pps-preference-pair
    args:
      root_path: ./load/PPS/images
      response_dir: ./load/PPS/responses/train
      cache: in_memory
  wrapper:
    name: pps-color-augmented
    args:
      crop_size: 64
      augment: true
      augment_params:
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
  batch_size: 2
  sampler:
    iterations_per_user: 4  # Small number for quick testing

optimizer:
  name: adam
  args:
    lr: 1.e-4
    betas: [0.9, 0.999]

epoch_max: 10   # Quick test: just 10 epochs
epoch_val: 5    # Validate every 5 epochs
epoch_save: 5   # Save every 5 epochs

loss_schedule:
  schedule_type: exponential
  w_p_start: 0.5
  w_p_end: 0.8

# =============================================================================
# Validation Configuration - Quick Test Settings
# =============================================================================

encoder_checkpoint: ./save/_train_pps_test_2users/encoder/epoch-last.pth

decoder_training:
  samples_per_user: 16  # Reduced for quick testing
  eval_samples_per_user: 4  # Reduced for quick testing
  batch_size: 2

  optimizer:
    name: adam
    args:
      lr: 1.e-4
      betas: [0.9, 0.999]

  loss_schedule:
    schedule_type: exponential
    w_p_start: 0.5
    w_p_end: 0.8

  eval_checkpoints: [50, 100, 200]  # Fewer checkpoints for quick testing
  max_iterations: 200  # Reduced from 1000
  patch_size: 64
  stride: 32

augmentation:
  train_aug:
    crop_size: 64
    augment: true
    augment_params:
      brightness: 0.1
      contrast: 0.1
      saturation: 0.1
      hue: 0.05

  eval_aug_same:
    augment: true
    augment_params:
      brightness: 0.1
      contrast: 0.1
      saturation: 0.1
      hue: 0.05

  eval_aug_different:
    augment: true
    augment_params:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.1

  clean:
    augment: false

num_val_users: 2  # Test with only 2 users

# Use only fast metrics for quick testing
metrics:
  - psnr
  - ssim
  - lpips
  - delta_e_oklab  # Fast color metric
  - niqe

save_images: true
save_interval: null
