# =============================================================================
# Unified UPE Configuration with SwinIR Encoder (SMALL CONFIG)
# =============================================================================
# Experiment: train_pps_upe_swinir
# Validation Config: configs/validate-upe/validate_upe_swinir.yaml
#
# 이 config는 train_upe.py와 validate_upe.py 모두에서 사용됩니다.
#
# 🆕 NEW FEATURES (UPE System - docs/plan/ 참고):
# - User-specific decoders (100개) → Global decoder (1개) + UPE (512-dim)
# - Parameters: 512M → 22M (96% 감소)
# - Training: Curriculum learning → Mixed-user batching (1.5-2× 속도 향상)
# - Validation: Test-time training (1000 iter) → Direct inference (10× 속도 향상)
#
# ⚙️ SWINIR-SPECIFIC NOTES (SMALL CONFIG):
# - Transformer-based encoder with depths=[3,3,3,3,3,3] (smaller, faster)
# - Decoder: hidden_dim=384, blocks=24 (medium capacity)
# - Expected PSNR: ~23.7 dB
# - Training time: ~15-20 min/epoch
# - crop_size=64 (window_size=8의 배수여야 함)
# - Learning rate: 5e-4 (transformer 특성)
#
# Usage:
#   # Training
#   python train_upe.py --config configs/pps/upe_swinir.yaml --name my_exp --gpu 0
#
#   # Validation (별도 실행 권장)
#   python validate_upe.py \
#     --config configs/validate-upe/validate_upe_swinir.yaml \
#     --checkpoint save/my_exp/checkpoint_best.pth \
#     --gpu 0
# =============================================================================

# =============================================================================
# Shared Configuration (both training and validation)
# =============================================================================

model:
  name: hiif-global-upe  # 🆕 Global decoder with UPE injection (NOT hiif-pps!)
  args:
    # Input crop size (used to auto-set SwinIR img_size)
    crop_size: 64  # Should match train_dataset.wrapper.args.crop_size

    # Encoder specification
    encoder_spec:
      name: swinir
      args:
        no_upsampling: true
        # SwinIR configurable parameters:
        # img_size: auto-set from crop_size (128) - DO NOT override!
        embed_dim: 96              # Feature embedding dimension
        depths: [3, 3, 3, 3, 3, 3]  # Number of blocks per stage (6 stages)
        num_heads: [3, 3, 3, 3, 3, 3]  # Attention heads per stage
        window_size: 8              # Window size for attention (⚠️ crop_size must be multiple of this!)
        mlp_ratio: 2.0              # MLP expansion ratio
        # Regularization parameters:
        drop_rate: 0.0              # Dropout rate
        attn_drop_rate: 0.0         # Attention dropout rate
        drop_path_rate: 0.1         # Drop path rate (stochastic depth)
        # Output: (B, 180, H, W) features

    # 🆕 INCREASED DECODER CAPACITY (baseline: hidden_dim=256, blocks=16)
    # Global decoder는 모든 users를 처리해야 하므로 capacity 증가
    hidden_dim: 256  # ⬆️ 256 → 384 (50% increase)
    blocks: 16       # ⬆️ 16 → 24 (50% increase)  ⚠️ MUST divide hidden_dim evenly: 384/24=16
    upe_dim: 64     # UPE output dimension
    # → Decoder parameters: ~10M (baseline user decoder의 2배)

    # Note: input_type and output_type are hardcoded in HIIF_Global_UPE
    # - input_type: rgb (fixed)
    # - output_type: rgb_residual (fixed)

    # 🆕 UPE PROCESSOR (Shallow Transformer)
    # Raw UPE (16, 1280) → Processed UPE (512,)
    upe_processor_config:
      # input_dim: Auto-calculated from upe_config (content_model + color_model dimensions)
      projection_dim: 128   # 🆕 Learnable per-vector projection (addresses normalization issues)
      hidden_dim: 128       # Transformer internal dimension
      output_dim: 64       # Output dimension (upe_dim)
      num_layers: 3         # 🆕 Shallow transformer (16 vectors는 작으므로 충분)
      num_heads: 4          # Multi-head attention heads
      dropout: 0.1          # Dropout rate (transformer에는 중요)
      # Note: ffn_dim is hardcoded as hidden_dim * 4 = 2048
      # Note: activation is hardcoded as 'gelu'

# 🆕 UPE CONFIGURATION (train_upe.py & validate_upe.py)
# User Preference Embedding: user의 선호도를 512-dim vector로 압축
upe_config:
  # Feature extractor 모델 선택 (고정 variant 사용)
  # Fixed variants: clip (ViT-B/16, 512-dim), dino (vitb16, 768-dim),
  #                 dinov2 (base, 768-dim), dinov3 (vitb16, 768-dim), sam (vit_b, 768-dim)
  content_model: sam  # 🔬 Options: dino, dinov2, dinov3, clip, sam
                         # DINOv3: Latest self-supervised vision model (Meta AI 2025)
                         # Better semantic/structural features than DINO v1
                         # 출력: (768,) per image (fixed variant: dinov3_vitb16)

  color_model: dinov2    # 🔬 Options: clip, dino, dinov2, dinov3, sam
                       # CLIP: Style/color features (color 추출에 유리)
                       # 출력: (512,) per image (fixed variant: ViT-B/16)
                       # ⚠️ content_model과 달라야 함!

  num_pairs: 16        # 🔒 FIXED: UPE 추출에 사용할 preference pairs 수
                       # User당 M개 pairs 중 16개를 UPE용으로 사용
                       # 나머지 M-16개는 training/evaluation용

  normalize: true      # L2 normalization 적용
                       # Content embedding: (16, 768) → L2 norm=1.0 each
                       # Color difference: (16, 512) → L2 norm=1.0 each

  seed: 42             # 🎲 Deterministic random pair selection
                       # User별로 고정된 seed 사용 (user_id + seed → hash)
                       # → 재현 가능한 실험

  cache_dir: ./cache/upe  # UPE cache base directory (dataset-specific subdirs auto-created)

  use_dataset_subdirs: false  # 🆕 Use dataset-specific subdirectories (train/validation/evaluation)?
                               # true: cache/upe/{dataset_name}/{model_pair}/ (organized, need re-extraction per dataset)
                               # false: cache/upe/{model_pair}/ (shared across datasets, uses existing caches)
                               # Set false to use caches extracted without dataset_name

  # 📐 Dimension Flow (UPE Extraction):
  # prefer_imgs: (16, 3, H, W)
  # non_prefer_imgs: (16, 3, H, W)
  # ↓ DINO content
  # prefer_feat: (16, 768)
  # non_prefer_feat: (16, 768)
  # ↓ Average + Normalize (⚠️ KEY: per-pair averaging!)
  # content_emb: (16, 768) with norm=1.0
  # ↓ CLIP color
  # prefer_color: (16, 512)
  # non_prefer_color: (16, 512)
  # ↓ Difference + Normalize
  # color_diff: (16, 512) with norm=1.0
  # ↓ Concatenate
  # raw_upe: (16, 1280)  # ⚠️ NOT (32, 1280)! Content is averaged per pair
  # ↓ UPE Processor (Shallow Transformer) - see model.args.upe_processor_config
  # processed_upe: (512,)  # ← CACHED per user

# Data normalization (same as baseline)
data_norm:
  inp: {sub: [0.5], div: [0.5]}  # Normalize input to [-1, 1]
  gt: {sub: [0.5], div: [0.5]}   # Normalize ground truth to [-1, 1]

# =============================================================================
# Training Configuration (train_upe.py only)
# =============================================================================

train_dataset:
  dataset:
    name: pps-preference-pair  # Base preference pair dataset
    args:
      root_path: ./load/PPS/images

      # 📁 TRAINING DATASET SELECTION (choose one):
      response_dir: ./load/PPS/responses/train
      # response_dir: ./load/PPS/responses/train     # ~100 users (for full training)

      # ⚠️ Train/Val users are COMPLETELY DIFFERENT
      # No overlap between train and validation users!
      # num_upe_pairs and upe_seed are defined in upe_config

  wrapper:
    name: pps-color-augmented  # Color augmentation wrapper (UPE wrapper added in code)
    args:
      crop_size: 64  # ⚠️ MUST be multiple of window_size (8)! MATCHES model.args.crop_size
                      # Options: 64, 128, 192, 256
                      # 128 권장 (SwinIR의 sweet spot)

      augment: true   # 4-way HSV augmentation
      augment_params:
        brightness: 0.1  # HSV V channel ± 10%
        contrast: 0.1    # HSV V channel contrast ± 10%
        saturation: 0.1  # HSV S channel ± 10%
        hue: 0.05        # HSV H channel ± 5% (작게 유지)

  batch_size: 16  # 2 samples × 4 augmented = 8 images per batch
                 # ⚠️ SwinIR은 메모리를 더 많이 사용함!
                 # 🔬 GPU memory에 따라 조절: 1 (8GB), 2 (12GB), 4 (24GB)

  # 🆕 NO MORE SAMPLER!
  # Baseline: PPSUserBatchSampler (user별로 grouping, decoder load/offload)
  # UPE: Standard random sampler (mixed-user batching OK!)
  # → 1.5-2× faster training (no decoder switching overhead)

optimizer:
  name: adam
  args:
    lr: 1.e-4  # ⬆️ HIGHER than EDSR (1e-4)!
               # Transformer는 일반적으로 더 높은 learning rate 필요
               # 🔬 Options: 2e-4 (safe), 5e-4 (baseline), 1e-3 (fast but risky)
    betas: [0.9, 0.999]  # Adam momentum parameters
    weight_decay: 0.0    # Optional: L2 regularization

# Optional: Cosine LR with warmup (like original SwinIR training)
# SwinIR는 warmup이 도움이 될 수 있음
# 실험으로 결정 - 주석 해제 시 사용
# lr_scheduler:
#   name: cosine_with_warmup
#   args:
#     warmup_epochs: 10      # 10 epochs warmup
#     warmup_lr_init: 1.e-6  # Initial LR for warmup
#     lr_min: 1.e-6          # Minimum LR at end of cosine decay
#     T_max: 200             # Total epochs (same as epoch_max)

# Training duration
epoch_max: 100  # 🔬 Full training: 200-500 epochs
                # Quick test: 50 epochs
                # Pilot study: 100 epochs
                # ⚠️ SwinIR는 수렴이 느릴 수 있음 (transformer 특성)

epoch_val: 10   # Validate every 10 epochs (or 20 for longer training)
epoch_save: 10  # Save checkpoint every 10 epochs

# 🆕 DUAL GROUND TRUTH LOSS SCHEDULING
# L_total = w_p × L1(pred, gt_prefer) + (1 - w_p) × L1(pred, gt_non_prefer)
loss_schedule:
  schedule_type: logarithmic  # ⬆️ LINEAR for SwinIR (not exponential!)
                         # Transformer는 linear schedule이 더 안정적
  w_p_start: 0.5  # 초기: prefer/non_prefer 균등 (50%/50%)
  w_p_end: 1.5    # ⬆️ 최종: prefer 더 집중 (90%/10%) - EDSR보다 높게
  # → 학습 초반: 둘 다 학습, 후반: prefer에 더 집중

# =============================================================================
# Validation Configuration (validate_upe.py only)
# =============================================================================

val_dataset:
  dataset:
    name: pps-preference-pair  # Base preference pair dataset
    args:
      root_path: ./load/PPS/images

      # 📁 EVALUATION DATASET
      response_dir: ./load/PPS/responses/evaluation  # 🆕 EVALUATION dataset
      # response_dir: ./load/PPS/responses/validation    # ~20-30 users (for thorough evaluation)

      # ⚠️ Validation users는 train과 완전히 다름!
      # 동일 user 사용 금지!
      # num_upe_pairs and upe_seed are defined in upe_config

  wrapper:
    name: pps-color-augmented  # Color augmentation wrapper (UPE wrapper added in code)
    args:
      crop_size: 64  # ⚠️ MUST match training crop_size for SwinIR! MATCHES model.args.crop_size
                      # SwinIR의 positional encoding이 crop_size에 의존
      augment: false  # 🔒 Validation: No augmentation

  batch_size: 16



# 🆕 VALIDATION CONFIGURATION (Direct Inference!)
# NOTE: For thorough validation, use validate_upe.py with configs/validate-upe/validate_upe_swinir.yaml
validation:
  # 👥 NUMBER OF VALIDATION USERS
  num_val_users: null  # null = all validation users (9 for toy, ~20-30 for full)
                       # or specify number (e.g., 5 for quick validation during training)

  # 🆕 NO MORE TEST-TIME TRAINING!
  # Baseline: 각 user마다 새 decoder 생성 → 1000 iterations 학습 → 평가
  # UPE: UPE 추출 (16 pairs) → global decoder로 직접 inference
  # → 10× faster validation
  # num_upe_pairs is defined in upe_config

  # 📊 EVALUATION SAMPLES
  num_eval_pairs: 8   # 평가에 사용할 preference pairs 수
                        # -1: 모든 pairs 사용 (full evaluation) - RECOMMENDED
                        # 16: JSON당 16 pairs 사용 (전체 평가)
                        # N: N pairs 사용 (quick check)

  # 🖼️ EVALUATION MODE
  eval_mode: full  # patch/full
                    # patch: Patch-based evaluation (메모리 효율적) - SwinIR 권장!
                    # full: Full-image evaluation (느리고 OOM 위험)

  patch_size: 64   # ⚠️ MUST be multiple of window_size (8)! MATCHES crop_size
                    # Options: 64 (default), 128, 192, 256

  stride: 32        # Stride for sliding window (overlap = patch_size - stride)
                    # 🔬 stride 작을수록 정확하지만 느림:
                    # 32 (slow, high quality), 64 (baseline), 96 (fast, lower quality)

  patch_batch_size: 16  # Number of patches to process in parallel (for GPU efficiency)

# Metrics to compute
metrics:
  - psnr              # ✅ Peak Signal-to-Noise Ratio (필수)
  - ssim              # ✅ Structural Similarity Index
  - lpips             # ✅ Learned Perceptual Image Patch Similarity
  - delta_e_cie76     # Color difference: CIE 1976 (LAB Euclidean)
  - delta_e_oklab     # Color difference: OKLab (modern, fast)
  - ciede2000         # Color difference: CIE Delta E 2000 (industry standard)
  - delta_e_cam16     # Color difference: CAM16-UCS (most accurate, slow)
  - niqe              # Natural Image Quality Evaluator (no-reference)

  # 🔬 실험 시 빠른 테스트: [psnr, ssim, lpips]만 사용
  # 🔬 최종 평가: 모든 metrics 사용

# Results
save_images: true    # Save generated images
save_interval: null  # null: save at checkpoints only (10, 20, 30, ...)
                     # N: save every N epochs

# =============================================================================
# Cache Configuration Note:
# UPE cache settings (cache_dir) are now defined in the 'upe_config' section above
# Cache invalidation triggers:
# - content_model or color_model changed
# - num_pairs changed
# - seed changed
# - Shape mismatch
# - Corrupted file
# =============================================================================
# DIMENSION FLOW SUMMARY (SwinIR)
# =============================================================================
# 📐 Complete dimension flow for reference:
#
# [UPE Extraction Phase - Per User]
# 16 Preference Pairs → Raw UPE (16, 1280) → Processed UPE (512,) [CACHED]
#
# [Training/Inference Phase - Batch]
# Input: (B, 3, H, W)
# UPE: (B, 512) [from cache]
# ↓ Encoder (SwinIR)
# Features: (B, 180, H_f, W_f)  # ⚠️ 180 not 64 (EDSR)!
# ↓ Freq Conv
# Freq Features: (B, 384, H_f, W_f)
# ↓ Grid Sampling (4 neighbors)
# Grid: (B, H_q×W_q, 1538)  # 384×4 neighbors + 2 offsets
# ↓ UPE Spatial Expansion
# UPE Expanded: (B, H_q×W_q, 512)
# ↓ Prepare decoder input
# Hi Coord: (B, H_q×W_q, 2)
# ↓ Concatenate [grid + hi_coord + upe_expanded]
# Decoder Input: (B, H_q×W_q, 2052)  # 1538 + 2 + 512
# ↓ Global Decoder (20 blocks, hidden_dim=384)
# Output: (B, 3, H_q, W_q)
#
# =============================================================================

# =============================================================================
# MODEL PARAMETERS COMPARISON (SwinIR vs EDSR)
# =============================================================================
# Component              | EDSR-UPE           | SwinIR-UPE         | Change
# -----------------------|--------------------|--------------------|---------
# Encoder                | ~11.8M (EDSR)      | ~11.8M (SwinIR)    | ≈
# Decoder (global)       | ~10M               | ~10M               | =
# UPE Processor          | ~2.1M              | ~2.1M              | =
# -----------------------|--------------------|--------------------|---------
# Total                  | ~22M               | ~22M               | =
# -----------------------|--------------------|--------------------|---------
# Training time          | ~30min/epoch       | ~40min/epoch       | ⬆️ 33% slower
# Memory usage           | ~6GB               | ~8GB               | ⬆️ 33% more
# Quality (expected)     | Good (CNN)         | Better (Transformer)| ⬆️
# Long-range modeling    | Limited (receptive)| Strong (attention) | ✅
# =============================================================================

# =============================================================================
# SWINIR-SPECIFIC TIPS
# =============================================================================
# 1. crop_size MUST be multiple of window_size (8): 64, 128, 192, 256
# 2. Use higher learning rate than EDSR (5e-4 vs 1e-4)
# 3. Consider cosine LR schedule with warmup
# 4. Use linear loss schedule (not exponential)
# 5. Training 시간이 EDSR보다 30-40% 더 걸림
# 6. Validation도 patch-based로 해야 OOM 방지
# 7. SwinIR은 수렴이 느릴 수 있으므로 patience 필요
# =============================================================================
