# UPE Extraction Configuration
# Content Model: DINOv2 | Color Model: DINOv2
# Output: (16, 1536) = dinov2(768) + dinov2(768)

# Feature extraction models
content_model: dinov2       # DINOv2 for content features  # Using fixed variant (see code)
color_model: dinov2         # DINOv2 for color/style features  # Using fixed variant (see code)

# UPE settings
num_pairs: 32               # Number of preference pairs for UPE extraction
normalize: true             # L2-normalize embeddings

# Adaptive projection (optional)
use_adaptive_projection: false  # No projection needed (same dimensions)
projection_dim: 768             # Target dimension (not used when false)
