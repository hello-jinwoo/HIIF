# UPE Extraction Configuration
# Content Model: SAM | Color Model: SAM
# Output: (16, 1536) = sam(768) + sam(768)

# Feature extraction models
content_model: sam          # SAM for content features
content_model_variant: vit_b        # 768 dims
color_model: sam            # SAM for color/style features
color_model_variant: vit_b  # 768 dims

# UPE settings
num_pairs: 16               # Number of preference pairs for UPE extraction
normalize: true             # L2-normalize embeddings

# Adaptive projection (optional)
use_adaptive_projection: false  # No projection needed (same dimensions)
projection_dim: 768             # Target dimension (not used when false)
