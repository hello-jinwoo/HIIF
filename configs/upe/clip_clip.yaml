# UPE Extraction Configuration
# Content Model: CLIP | Color Model: CLIP
# Output: (16, 1024) = clip(512) + clip(512)

# Feature extraction models
content_model: clip         # CLIP for content features
content_model_variant: ViT-B/16     # 512 dims
color_model: clip           # CLIP for color/style features
color_model_variant: ViT-B/16       # 512 dims

# UPE settings
num_pairs: 16               # Number of preference pairs for UPE extraction
normalize: true             # L2-normalize embeddings

# Adaptive projection (optional)
use_adaptive_projection: false  # No projection needed (same model)
projection_dim: 768             # Target dimension (not used when false)
