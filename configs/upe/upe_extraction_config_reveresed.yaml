# UPE Extraction Configuration
# This config is used for extracting User Preference Embeddings from preference pairs

# Dataset settings
root_path: ./load/PPS/images
response_dir: null  # Auto-set based on split (train → responses/train, validation → responses/validation)
split: train  # train or validation

# Cache settings
cache_dir: ./cache/upe

# Feature extraction models
content_model: clip  # Options: clip, dino (MUST be different from color_model)
color_model: dino    # Options: clip, dino (MUST be different from content_model)

# Model variants (optional, uses default if not specified)
# content_model_variant: dino_vitb16  # For DINO: dino_vitb16, dino_vits16
# color_model_variant: ViT-B/16       # For CLIP: ViT-B/16, ViT-L/14

# UPE extraction settings
num_pairs: 16  # Number of preference pairs to use for UPE extraction
normalize: true  # L2 normalize embeddings

# Device settings
device: cuda  # cuda or cpu

# Processing options
force_recompute: false  # Force recompute even if cache exists
verbose: false  # Print verbose output

# Expected dimensions (automatically computed, for reference)
# content_dim: 768  # DINO ViT-B
# color_dim: 512    # CLIP ViT-B/16
# raw_upe_shape: [16, 1280]  # (num_pairs, content_dim + color_dim)
