# UPE Validation Configuration - Quick Test
# Purpose: Quick validation test to verify pipeline
# Expected time: ~2-5 minutes for validation split (~9 users)

# ============================================================
# Model Configuration (must match training config)
# ============================================================
model:
  name: hiif-global-upe
  args:
    encoder_spec:
      name: edsr-baseline
      args:
        no_upsampling: true
        n_resblocks: 16
        n_feats: 64
        scale: 1

    hidden_dim: 384
    blocks: 24

    upe_processor_config:
      input_dim: 1280
      hidden_dim: 512
      output_dim: 512
      num_layers: 3
      num_heads: 8
      dropout: 0.1

# ============================================================
# UPE Configuration (must match training config)
# ============================================================
upe_config:
  content_model: dino
  color_model: clip
  num_pairs: 16          # Number of pairs for UPE extraction
  normalize: true
  content_dim: 768
  color_dim: 512
  cache_dir: ./cache/upe

# ============================================================
# Validation Dataset
# ============================================================
val_dataset:
  dataset:
    name: pps-preference-pair
    args:
      root_path: ./load/PPS/images
      response_dir: ./load/PPS/responses/validation
      cache: in_memory

  wrapper:
    name: pps-color-augmented
    args:
      crop_size: 64      # Match training crop size
      augment: false     # No augmentation for validation

# ============================================================
# Validation Settings
# ============================================================
min_eval_samples: 8      # Minimum evaluation samples per user
                         # Users with < (num_pairs + min_eval_samples) will be skipped

# Skip users with insufficient samples
skip_insufficient_users: true

# ============================================================
# Metrics to Compute
# ============================================================
metrics:
  - psnr              # Peak Signal-to-Noise Ratio
  - ssim              # Structural Similarity Index
  - lpips             # Learned Perceptual Image Patch Similarity
  - delta_e_cie76     # CIE76 Delta E (LAB Euclidean)
  - ciede2000         # CIEDE2000 perceptual color difference
  # - delta_e_oklab   # OKLab Delta E (optional)
  # - delta_e_cam16   # CAM16-UCS Delta E (optional, requires colour-science)

# ============================================================
# Data Normalization (must match training)
# ============================================================
data_norm:
  inp: {sub: [0.5], div: [0.5]}   # Input: [0, 1] → [-1, 1]
  gt: {sub: [0.5], div: [0.5]}    # GT: [0, 1] → [-1, 1]

# ============================================================
# Notes
# ============================================================
# Usage:
#   python validate_upe.py \
#     --config configs/validate-upe/validate_upe_edsr_test.yaml \
#     --checkpoint save/upe_test_fixed/checkpoint_best.pth \
#     --gpu 0
#
# Expected output:
#   save/upe_test_fixed/validation/
#   ├── validation_results.json    # Full results with per-user metrics
#   ├── validation_summary.csv     # Summary table (mean ± std)
#   └── validation_log.txt         # Validation log
#
# Key features:
#   - Direct inference (NO test-time training)
#   - UPE extraction from first 16 samples
#   - Evaluation on remaining samples
#   - Comprehensive metrics (PSNR, SSIM, LPIPS, color metrics)
#   - Fast: ~2-5 minutes for validation split
