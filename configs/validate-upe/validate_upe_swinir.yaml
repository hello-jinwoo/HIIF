# UPE Validation Configuration - SwinIR Encoder
# Purpose: Full validation on all validation users with SwinIR encoder
# Expected time: ~20-25 minutes for full validation split (slightly slower than EDSR)

# ============================================================
# Model Configuration (must match training config)
# ============================================================
model:
  name: hiif-global-upe
  args:
    # Encoder (SwinIR - must match training)
    encoder_spec:
      name: swinir
      args:
        no_upsampling: true
        img_size: 128
        patch_size: 1
        embed_dim: 180
        depths: [6, 6, 6, 6, 6, 6]
        num_heads: [6, 6, 6, 6, 6, 6]
        window_size: 8
        mlp_ratio: 2
        qkv_bias: true
        qk_scale: null
        drop_rate: 0.0
        attn_drop_rate: 0.0
        drop_path_rate: 0.1
        norm_layer: nn.LayerNorm
        ape: false
        patch_norm: true
        use_checkpoint: false
        upscale: 1
        img_range: 1.0
        upsampler: ''
        resi_connection: '1conv'

    hidden_dim: 384
    blocks: 24

    upe_processor_config:
      input_dim: 1280
      hidden_dim: 512
      output_dim: 512
      num_layers: 3
      num_heads: 8
      dropout: 0.1

# ============================================================
# UPE Configuration (must match training config)
# ============================================================
upe_config:
  content_model: dino
  color_model: clip
  num_pairs: 16
  normalize: true
  content_dim: 768
  color_dim: 512
  cache_dir: ./cache/upe

# ============================================================
# Validation Dataset
# ============================================================
val_dataset:
  dataset:
    name: pps-preference-pair
    args:
      root_path: ./load/PPS/images
      response_dir: ./load/PPS/responses/validation
      cache: in_memory

  wrapper:
    name: pps-color-augmented
    args:
      crop_size: 128     # Larger crop for better quality assessment
      augment: false

# ============================================================
# Validation Settings
# ============================================================
min_eval_samples: 8
skip_insufficient_users: true

# ============================================================
# Metrics to Compute (comprehensive)
# ============================================================
metrics:
  - psnr
  - ssim
  - lpips
  - delta_e_cie76
  - ciede2000
  # - delta_e_oklab
  # - delta_e_cam16

# ============================================================
# Data Normalization (must match training)
# ============================================================
data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}

# ============================================================
# Notes
# ============================================================
# Usage:
#   python validate_upe.py \
#     --config configs/validate-upe/validate_upe_swinir.yaml \
#     --checkpoint save/upe_swinir_v1/checkpoint_best.pth \
#     --gpu 0
#
# Comparison with baseline PPS validation:
#   Baseline: ~3 hours (1000 iter test-time training per user)
#   UPE:      ~20-25 minutes (direct inference)
#   Speedup:  ~8-10x faster
#
# SwinIR-specific notes:
#   - Slightly slower than EDSR due to transformer architecture
#   - Better feature representation may lead to improved metrics
#   - crop_size=128 is optimal for window_size=8
