# UPE Training Configuration - SwinIR Encoder
# Purpose: Full training for production model with SwinIR encoder
# Expected time: ~12-18 hours for 200 epochs (SwinIR is slightly slower than EDSR)

# ============================================================
# Model Configuration
# ============================================================
model:
  name: hiif-global-upe  # Global decoder with UPE conditioning
  args:
    # Encoder (SwinIR - Transformer-based)
    encoder_spec:
      name: swinir
      args:
        no_upsampling: true
        # SwinIR architecture params
        img_size: 128        # Auto-adjusted to crop_size
        patch_size: 1
        embed_dim: 180       # SwinIR baseline dimension
        depths: [6, 6, 6, 6, 6, 6]    # 6 stages, 6 blocks each
        num_heads: [6, 6, 6, 6, 6, 6] # Attention heads per stage
        window_size: 8       # Window size for local attention
        mlp_ratio: 2         # MLP expansion ratio
        qkv_bias: true
        qk_scale: null
        drop_rate: 0.0
        attn_drop_rate: 0.0
        drop_path_rate: 0.1
        norm_layer: nn.LayerNorm
        ape: false           # Absolute position embedding
        patch_norm: true
        use_checkpoint: false
        upscale: 1
        img_range: 1.0
        upsampler: ''
        resi_connection: '1conv'

    # Global Decoder Settings
    hidden_dim: 384        # Increased from baseline's 256 (more capacity)
    blocks: 24             # Increased from baseline's 16 (more capacity)

    # UPE Processor Settings (integrated in model)
    upe_processor_config:
      input_dim: 1280      # DINO (768) + CLIP (512)
      hidden_dim: 512      # UPE transformer hidden dimension
      output_dim: 512      # UPE output dimension (injected into decoder)
      num_layers: 3        # Shallow transformer (3 layers)
      num_heads: 8         # Multi-head attention
      dropout: 0.1

    # Note: Input/Output are hard-coded to RGB-only in model
    # input_type: rgb (hard-coded)
    # output_type: rgb_residual (hard-coded)

# ============================================================
# UPE Configuration
# ============================================================
upe_config:
  # Feature extraction models (MUST be different)
  content_model: dino      # Options: clip, dino
  color_model: clip        # Options: clip, dino (must ≠ content_model)

  # Model variants (optional, uses defaults if not specified)
  # content_model_variant: dino_vitb16
  # color_model_variant: ViT-B/16

  # UPE extraction settings
  num_pairs: 16           # Number of preference pairs for UPE extraction
  normalize: true         # L2 normalize embeddings

  # Expected dimensions (auto-computed, for reference)
  content_dim: 768        # DINO ViT-B
  color_dim: 512          # CLIP ViT-B/16
  # raw_upe_shape: [16, 1280]  # (num_pairs, content_dim + color_dim)

  # Cache settings
  cache_dir: ./cache/upe  # Where UPEs are cached

# ============================================================
# Training Dataset
# ============================================================
train_dataset:
  # Base dataset
  dataset:
    name: pps-preference-pair
    args:
      root_path: ./load/PPS/images
      response_dir: ./load/PPS/responses/train
      cache: in_memory  # Load all images to memory for speed

  # Color augmentation wrapper
  wrapper:
    name: pps-color-augmented
    args:
      crop_size: 128     # Standard crop size (good for SwinIR window_size=8)
      augment: true
      augment_params:
        brightness: 0.1  # HSV perturbation ranges
        contrast: 0.1
        saturation: 0.1
        hue: 0.05

  # Batch settings (mixed-user batching)
  batch_size: 6           # Slightly smaller than EDSR (SwinIR uses more memory)
                          # With H100 96GB, this should be safe
  # Note: UPE wrapper automatically splits 16 pairs for UPE, rest for training

# ============================================================
# Validation Dataset
# ============================================================
val_dataset:
  dataset:
    name: pps-preference-pair
    args:
      root_path: ./load/PPS/images
      response_dir: ./load/PPS/responses/validation
      cache: in_memory

  wrapper:
    name: pps-color-augmented
    args:
      crop_size: 128
      augment: false      # No augmentation for validation

  batch_size: 6

# ============================================================
# Optimizer
# ============================================================
optimizer:
  name: adam
  args:
    lr: 1.e-4             # Learning rate (same as EDSR)
    betas: [0.9, 0.999]
    weight_decay: 0       # No weight decay for now

# Optional: Learning rate scheduler
# lr_scheduler:
#   name: cosine
#   args:
#     T_max: 200          # Cosine annealing period
#     eta_min: 1.e-6      # Minimum LR

# ============================================================
# Loss Schedule (Dual GT Loss)
# ============================================================
# Loss formula: L = w_p × L1(pred, gt_prefer) + (1 - w_p) × L1(pred, gt_non_prefer)
# w_p increases from w_p_start to w_p_end over training
loss_schedule:
  schedule_type: exponential  # Options: uniform, linear, exponential, logarithmic
  w_p_start: 0.5              # Start: balanced between prefer/non-prefer
  w_p_end: 1.2                # End: more focus on prefer (1.2 > 1.0 means negative weight on non-prefer)
  # total_iterations: auto-computed as epoch_max × batches_per_epoch

# ============================================================
# Training Schedule
# ============================================================
epoch_max: 200            # Full training: 200 epochs (can extend to 500 if needed)
epoch_val: 10             # Validate every 10 epochs
epoch_save: 10            # Save checkpoint every 10 epochs

# ============================================================
# Data Normalization
# ============================================================
data_norm:
  inp: {sub: [0.5], div: [0.5]}   # Input: [0, 1] → [-1, 1]
  gt: {sub: [0.5], div: [0.5]}    # GT: [0, 1] → [-1, 1]

# ============================================================
# Notes
# ============================================================
# Usage:
#   python train_upe.py --config configs/train-upe/train_upe_swinir.yaml --name upe_swinir_v1 --gpu 0
#
# Resume training:
#   python train_upe.py --config configs/train-upe/train_upe_swinir.yaml --name upe_swinir_v1 --gpu 0
#   (automatically resumes from save/upe_swinir_v1/checkpoint_last.pth if exists)
#
# Expected output:
#   save/upe_swinir_v1/
#   ├── checkpoint_last.pth       # Latest checkpoint
#   ├── checkpoint_best.pth       # Best validation PSNR
#   ├── checkpoint_epoch_10.pth   # Periodic checkpoints
#   ├── checkpoint_epoch_20.pth
#   ├── ...
#   ├── config.yaml               # Saved config
#   ├── log_train.txt             # Training log
#   └── training_metrics.csv      # CSV metrics
#
# Performance targets:
#   - Train loss: should converge to < 0.05
#   - Validation PSNR (prefer): > 28 dB
#   - Validation PSNR (non-prefer): 2-4 dB lower than prefer
#
# Hyperparameter tuning:
#   - If OOM: reduce batch_size to 4 or crop_size to 96
#   - If overfitting: add weight_decay (e.g., 1.e-4) or dropout
#   - If underfitting: increase epoch_max to 300-500, or hidden_dim to 512
#   - If loss plateau: try different lr_scheduler (cosine, step)
#
# SwinIR-specific notes:
#   - SwinIR is slower than EDSR but provides richer features
#   - crop_size=128 works well with window_size=8 (128 % 8 = 0)
#   - Consider increasing crop_size to 256 for better context if memory allows
#   - SwinIR uses more memory than EDSR, so batch_size is reduced from 8 to 6
